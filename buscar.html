<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔍 Buscar IMEI en Facturas 🔍</title>

  <!-- Firebase SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <!-- Config de Firebase -->
  <script src="https://facturacionweb.github.io/facturacionweb/firebase-config.js"></script>

  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    .container { max-width: 980px; background: #fff; margin: auto; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
    .invoice-body, .details-table, .items-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .details-table td, .items-table td, .items-table th { border: 1px solid #ccc; padding: 8px; text-align: left; }
    .items-table th { background-color: #333; color: white; }
    .invoice-header h2 { margin: 0; }
    .signature { margin-top: 30px; text-align: center; }
    small { color:#333 }
    .result-section { margin-top: 24px; padding-top: 16px; border-top: 2px solid #ddd; }
    .result-section:first-child { border-top: 0; padding-top: 0; }
    .badge { display:inline-block; padding:4px 8px; border-radius:999px; background:#eef2ff; color:#3730a3; font-weight:bold; font-size:12px; }
    .not-found { color:#b42318; background:#fef3f2; border:1px solid #fecdca; padding:12px; border-radius:6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Buscar Factura por IMEI 🔍</h1>
    <input type="text" id="imeiInput" placeholder="Ingresa el IMEI a buscar" />
    <button onclick="buscarFacturaPorIMEI()">Buscar IMEI 📲</button>
    <div id="facturaResultado"></div>
  </div>

  <script>
    const db = firebase.firestore();

    // Agrupa items por artículo/precio/desc, acumulando cantidad/total e IMEIs
    function agruparItemsFactura(items) {
      const map = new Map();
      items.forEach(item => {
        const brand = item.brand || item.marca || '';
        const model = item.model || item.modelo || '';
        const price = Number(item.price ?? item.precioVenta ?? 0);
        const discount = Number(item.discount ?? 0);

        const key = `${item.articleId}|${brand}|${model}|${price}|${discount}`;
        if (!map.has(key)) {
          map.set(key, {
            quantity: 0,
            brand,
            model,
            price,
            discount,
            total: 0,
            imeis: []
          });
        }
        const group = map.get(key);
        const qty = Number(item.quantity ?? 1);
        const lineTotal = Number(item.total ?? (qty * price * (1 - discount/100)));
        group.quantity += qty;
        group.total += lineTotal;
        if (item.imei) group.imeis.push(item.imei);
      });
      return Array.from(map.values());
    }

    // Devuelve { proveedorId: nombreProveedor } usando la colección "proveedores"
    async function mapProveedoresPorIdDesdeItems(items) {
      const provIds = Array.from(new Set(
        (items || []).map(i => i.proveedorId).filter(Boolean)
      ));
      const provIdToName = {};
      for (const pid of provIds) {
        try {
          const pdoc = await db.collection("proveedores").doc(pid).get();
          provIdToName[pid] = pdoc.exists ? (pdoc.data().nombreProveedor || "N/D") : "N/D";
        } catch (e) {
          provIdToName[pid] = "N/D";
        }
      }
      return provIdToName;
    }

    async function buscarFacturaPorIMEI() {
      const imei = document.getElementById('imeiInput').value.trim();
      if (!imei) return alert('Debés ingresar un IMEI válido 😅');

      document.getElementById('facturaResultado').innerHTML = '<p>Buscando IMEI...</p>';

      // Buscamos entre facturas no anuladas
      const snapshot = await db.collection("facturas").where("anulada", "==", false).get();
      let facturaEncontrada = null;
      let facturaId = null;

      for (const doc of snapshot.docs) {
        const data = doc.data();
        const item = (data.items || []).find(i => i.imei === imei);
        if (item) {
          facturaEncontrada = data;
          facturaId = doc.id;
          break;
        }
      }

      if (!facturaEncontrada) {
        const facturaProveedorHtml = await buscarFacturaProveedorPorIMEI(imei);
        document.getElementById('facturaResultado').innerHTML =
          `<div class="result-section"><h2>Factura de cliente</h2><p class="not-found">No se encontro factura de cliente con este IMEI.</p></div>` +
          facturaProveedorHtml;
        return;
      }

      // Cliente
      const clientDoc = await db.collection("clientes").doc(facturaEncontrada.clientId).get();
      const cliente = clientDoc.exists ? clientDoc.data() : {};

      // Moneda & Fecha
      const symbol = facturaEncontrada.currency === 'CORD' ? 'C$' : '$';
      const fecha = facturaEncontrada.fecha?.toDate ? facturaEncontrada.fecha.toDate()
                                                    : new Date(facturaEncontrada.fecha);

      // 🔑 Nombres de proveedores desde la factura (a nivel de item)
      const provIdToName = await mapProveedoresPorIdDesdeItems(facturaEncontrada.items || []);

      // Construimos un mapa IMEI -> NombreProveedor/N/D
      const proveedoresPorIMEI = {};
      (facturaEncontrada.items || []).forEach(it => {
        if (!it?.imei) return;
        const name = it.proveedorId ? (provIdToName[it.proveedorId] || "N/D") : "N/D";
        proveedoresPorIMEI[it.imei] = name;
      });

      // Agrupamos items para presentación
      const itemsAgrupados = agruparItemsFactura(facturaEncontrada.items || []);

      const html = `
        <div class="result-section">
        <div class="invoice-header">
          <h2>Factura de cliente - ${facturaId}</h2>
          <p><strong>Consecutivo:</strong> ${facturaEncontrada.consecutivo || ''}</p>
          <p><strong>Ruta:</strong> ${facturaEncontrada.route || ''}</p>
          <span class="badge">Cliente</span>
        </div>
        <div class="invoice-body">
          <table class="details-table">
            <tr>
              <td><strong>Fecha:</strong><br>${fecha.toLocaleString()}</td>
              <td><strong>Cliente:</strong><br>${cliente.nombreCliente || facturaEncontrada.clientId}</td>
            </tr>
            <tr>
              <td><strong>Tienda:</strong><br>${cliente.nombreTienda || ''}</td>
              <td><strong>Dirección:</strong><br>${cliente.direccion || ''}</td>
            </tr>
            <tr>
              <td><strong>Teléfono:</strong><br>${cliente.telefono || ''}</td>
              <td><strong>Pago:</strong><br>${facturaEncontrada.paymentMethod || ''}</td>
            </tr>
          </table>

          <table class="items-table">
            <tr>
              <th>Cantidad</th>
              <th>Descripción</th>
              <th>Precio Venta</th>
              <th>Descuento</th>
              <th>Total</th>
            </tr>
            ${itemsAgrupados.map(item => `
              <tr>
                <td>${item.quantity}</td>
                <td>
                  ${item.brand} ${item.model}<br>
                  <small>
                    ${item.imeis.length > 0
                      ? 'IMEIs (Proveedor):<br>' +
                        item.imeis.map(i => `- ${i} — ${proveedoresPorIMEI[i] || 'N/D'}`).join('<br>')
                      : ''}
                  </small>
                </td>
                <td>${symbol}${Number(item.price || 0).toFixed(2)}</td>
                <td>${Number(item.discount || 0)}%</td>
                <td>${symbol}${Number(item.total || 0).toFixed(2)}</td>
              </tr>
            `).join('')}
            <tr>
              <td colspan="4" style="text-align:right;"><strong>Total a Pagar:</strong></td>
              <td><strong>${symbol}${Number(facturaEncontrada.total || 0).toFixed(2)}</strong></td>
            </tr>
          </table>

          <div class="signature">
            <p>_______________________</p>
            <p>Firma del Cliente</p>
          </div>
        </div>
        </div>
      `;

      const facturaProveedorHtml = await buscarFacturaProveedorPorIMEI(imei);
      document.getElementById('facturaResultado').innerHTML = html + facturaProveedorHtml;
    }

    async function buscarFacturaProveedorPorIMEI(imei) {
      const imeiSnap = await db.collection("Articulos_X_IMEI").where("imei", "==", imei).get();
      const imeiData = imeiSnap.empty ? null : imeiSnap.docs[0].data();
      let proveedorNombre = imeiData?.distribuidorNombre || "N/D";

      if ((!proveedorNombre || proveedorNombre === "N/D") && imeiData?.proveedorId) {
        try {
          const provDoc = await db.collection("proveedores").doc(imeiData.proveedorId).get();
          if (provDoc.exists) proveedorNombre = provDoc.data().nombreProveedor || "N/D";
        } catch (e) {
          proveedorNombre = "N/D";
        }
      }

      let facturaProveedor = null;
      let itemRelacionado = null;
      const facturaProveedorId = imeiData?.facturaProveedorId || null;

      if (facturaProveedorId) {
        const facturaDoc = await db.collection("Facturas_Proveedores").doc(facturaProveedorId).get();
        if (facturaDoc.exists) {
          facturaProveedor = { id: facturaDoc.id, ...facturaDoc.data() };
          itemRelacionado = (facturaProveedor.items || []).find(item => item.articleId === imeiData?.articleId) || null;
        }
      }

      if (!facturaProveedor || !itemRelacionado) {
        const facturaSnap = await db.collection("Facturas_Proveedores").get();
        for (const doc of facturaSnap.docs) {
          const factura = { id: doc.id, ...doc.data() };
          const item = (factura.items || []).find(detalle =>
            (detalle.loadedImeis || []).map(String).includes(String(imei))
          );

          if (item) {
            facturaProveedor = factura;
            itemRelacionado = item;
            proveedorNombre = factura.proveedorNombre || proveedorNombre;
            break;
          }
        }
      }

      if (!facturaProveedor) {
        if (!imeiData) {
          return `<div class="result-section"><h2>Factura de proveedor</h2><p class="not-found">No se encontro factura de proveedor con este IMEI.</p></div>`;
        }

        return `
          <div class="result-section">
            <h2>Factura de proveedor</h2>
            <table class="details-table">
              <tr>
                <td><strong>IMEI:</strong><br>${imei}</td>
                <td><strong>Proveedor:</strong><br>${proveedorNombre}</td>
              </tr>
              <tr>
                <td><strong>Factura proveedor:</strong><br>${imeiData.facturaDistribuidor || 'N/D'}</td>
                <td><strong>Tipo:</strong><br>${imeiData.tipoFacturaProveedor || 'N/D'}</td>
              </tr>
            </table>
            <p class="not-found">El IMEI tiene datos de proveedor, pero no tiene una factura de proveedor enlazada.</p>
          </div>
        `;
      }

      itemRelacionado = itemRelacionado || {};
      const total = Number(facturaProveedor.orderTotal || 0);
      const abonado = Number(facturaProveedor.totalAbonado || 0);
      const saldo = Math.max(total - abonado, 0);

      return `
        <div class="result-section">
          <div class="invoice-header">
            <h2>Factura de proveedor - ${facturaProveedor.orderNumber || facturaProveedor.id}</h2>
            <p><strong>Proveedor:</strong> ${facturaProveedor.proveedorNombre || proveedorNombre}</p>
            <span class="badge">Proveedor</span>
          </div>
          <div class="invoice-body">
            <table class="details-table">
              <tr>
                <td><strong>Order Date:</strong><br>${facturaProveedor.orderDate || 'N/D'}</td>
                <td><strong>Tipo:</strong><br>${facturaProveedor.invoiceType || 'N/D'}</td>
              </tr>
              <tr>
                <td><strong>Terms:</strong><br>${facturaProveedor.terms || 0} dias</td>
                <td><strong>IMEI encontrado:</strong><br>${imei}</td>
              </tr>
              <tr>
                <td><strong>Total:</strong><br>${total.toFixed(2)}</td>
                <td><strong>Saldo:</strong><br>${saldo.toFixed(2)}</td>
              </tr>
            </table>

            <table class="items-table">
              <tr>
                <th>Articulo</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Total</th>
                <th>IMEI</th>
              </tr>
              <tr>
                <td>${itemRelacionado.description || imeiData?.articleId || 'N/D'}</td>
                <td>${itemRelacionado.quantity || 'N/D'}</td>
                <td>${Number(itemRelacionado.price || 0).toFixed(2)}</td>
                <td>${Number(itemRelacionado.total || 0).toFixed(2)}</td>
                <td>${imei}</td>
              </tr>
            </table>
          </div>
        </div>
      `;
    }
  </script>

  <script type="module">
    import {requireAccess} from './auth.js';
    requireAccess('buscar');
  </script>
</body>
</html>
