<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>

    <!-- Import Firebase SDK (v8 with namespaced API) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <!-- Import Firebase configuration -->
    <script src="https://facturacionweb.github.io/facturacionweb/firebase-config.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
            background: #f4f6f8;
            color: #111827;
        }
        a {
            color: #0f5fa8;
            font-weight: 700;
            text-decoration: none;
        }
        .container {
            max-width: 1120px;
            margin: 18px auto 0;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            margin-bottom: 18px;
        }
        .page-header h1 {
            margin: 0;
            font-size: 30px;
        }
        .page-header p {
            margin: 6px 0 0;
            color: #667085;
        }
        .card {
            background: #fff;
            border: 1px solid #d8dee9;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            margin-bottom: 20px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }
        .field label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
            color: #344054;
        }
        input, select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            background: #fff;
        }
        input:focus, select:focus {
            outline: 2px solid #b9d7ff;
            border-color: #2f80ed;
        }
        .credit-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 16px;
            margin-top: 16px;
        }
        .toggle-field {
            min-height: 43px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #f8fafc;
        }
        .toggle-field input {
            width: auto;
            margin: 0;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }
        button {
            border: 1px solid #b8c2d0;
            border-radius: 6px;
            background: #fff;
            color: #111827;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 15px;
        }
        button.primary {
            background: #0f5fa8;
            border-color: #0f5fa8;
            color: #fff;
            font-weight: 700;
        }
        button.danger {
            background: #fef3f2;
            border-color: #fecdca;
            color: #b42318;
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }
        th, td {
            border: 1px solid #d8dee9;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background: #eef2f7;
            font-weight: 700;
        }
        .status-pill {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }
        .status-credit {
            background: #ecfdf3;
            color: #027a48;
        }
        .status-cash {
            background: #f2f4f7;
            color: #475467;
        }
        @media (max-width: 760px) {
            body {
                padding: 14px;
            }
            .page-header, .form-grid, .credit-row {
                display: block;
            }
            .field, .toggle-field {
                margin-bottom: 14px;
            }
            .actions button {
                width: 100%;
            }
        }
    </style>
    <script>
        // Cargar dinámicamente el script version.js con un parámetro de tiempo para evitar caché
        (function loadVersionScript() {
            const versionScript = document.createElement('script');
            versionScript.src = 'https://facturacionweb.github.io/facturacionweb/version.js?v=' + new Date().getTime();
            document.head.appendChild(versionScript);
        })();
    </script>
    
    <script type="module">
        import {requireAccess} from './auth.js';
        requireAccess('clientes');  
    </script>

</head>
<body>
    <a href="index.html">Volver a la Página Principal</a>
    
    <div class="container">
        <div class="page-header">
            <div>
                <h1>Gestión de Clientes</h1>
                <p>Registra datos comerciales y define si el cliente puede comprar a crédito.</p>
            </div>
        </div>

        <section class="card">
            <h2>Datos del cliente</h2>
            <div class="form-grid">
                <div class="field">
                    <label for="nombreCliente">Nombre del Cliente</label>
                    <input type="text" id="nombreCliente" placeholder="Nombre del Cliente" />
                </div>
                <div class="field">
                    <label for="nombreTienda">Nombre de la Tienda</label>
                    <input type="text" id="nombreTienda" placeholder="Nombre de la Tienda" />
                </div>
                <div class="field">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" placeholder="Dirección" />
                </div>
                <div class="field">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono" placeholder="Teléfono" />
                </div>
            </div>

            <div class="credit-row">
                <label class="toggle-field" for="clienteCredito">
                    <input type="checkbox" id="clienteCredito" onchange="toggleCreditDays()" />
                    Cliente de crédito
                </label>
                <div class="field" id="diasCreditoField" style="display:none;">
                    <label for="diasCredito">Días de crédito</label>
                    <select id="diasCredito">
                        <option value="10">10 días</option>
                        <option value="15">15 días</option>
                        <option value="30">30 días</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button class="primary" onclick="addOrUpdateClient()">Agregar/Actualizar Cliente</button>
                <button onclick="clearFields()">Limpiar Campos</button>
            </div>
        </section>

        <!-- Table to display clients -->
        <section class="card">
            <h2>Clientes Existentes</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID Cliente</th>
                            <th>Nombre del Cliente</th>
                            <th>Nombre de la Tienda</th>
                            <th>Dirección</th>
                            <th>Teléfono</th>
                            <th>Crédito</th>
                            <th>Días</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="clientTable">
                        <!-- Client rows will be populated here -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // Initialize Firestore
        const db = firebase.firestore();

        // Variable global para almacenar el ID del cliente que se está editando
        let idClienteActual = null;

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function toggleCreditDays() {
            const isCredit = document.getElementById('clienteCredito').checked;
            const diasField = document.getElementById('diasCreditoField');
            const diasSelect = document.getElementById('diasCredito');
            diasField.style.display = isCredit ? 'block' : 'none';
            diasSelect.disabled = !isCredit;
            if (!isCredit) diasSelect.value = '10';
        }

        // Function to clear input fields
        function clearFields() {
            document.getElementById('nombreCliente').value = '';
            document.getElementById('nombreTienda').value = '';
            document.getElementById('direccion').value = '';
            document.getElementById('telefono').value = '';
            document.getElementById('clienteCredito').checked = false;
            document.getElementById('diasCredito').value = '10';
            toggleCreditDays();
            idClienteActual = null;  // Limpiar el ID actual cuando se limpian los campos
        }

        // Function to add or update client
        function addOrUpdateClient() {
            const nombreCliente = document.getElementById('nombreCliente').value.trim();
            const nombreTienda = document.getElementById('nombreTienda').value.trim();
            const direccion = document.getElementById('direccion').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const clienteCredito = document.getElementById('clienteCredito').checked;
            const diasCredito = clienteCredito ? parseInt(document.getElementById('diasCredito').value, 10) : 0;

            if (!nombreCliente) {
                alert("Ingrese el nombre del cliente.");
                return;
            }
            if (clienteCredito && ![10, 15, 30].includes(diasCredito)) {
                alert("Seleccione días de crédito válidos.");
                return;
            }

            const payload = {
                nombreCliente: nombreCliente,
                nombreTienda: nombreTienda,
                direccion: direccion,
                telefono: telefono,
                clienteCredito: clienteCredito,
                diasCredito: diasCredito
            };

            if (idClienteActual) {
                // Si hay un ID de cliente actual, actualizamos el cliente existente
                db.collection("clientes").doc(idClienteActual).set(payload, { merge: true }).then(() => {
                    alert("Cliente actualizado con éxito");
                    loadClients();
                    clearFields(); // Limpiar los campos después de actualizar
                }).catch((error) => {
                    console.error("Error al actualizar el cliente: ", error);
                });
            } else {
                // Si no hay ID de cliente actual, agregamos un nuevo cliente
                db.collection("clientes").add(payload).then(() => {
                    alert("Cliente agregado con éxito");
                    loadClients();
                    clearFields(); // Limpiar los campos después de agregar
                }).catch((error) => {
                    console.error("Error al agregar el cliente: ", error);
                });
            }
        }

        // Function to load clients
        function loadClients() {
            db.collection("clientes").get().then((querySnapshot) => {
                const clientTable = document.getElementById('clientTable');
                clientTable.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const client = doc.data();
                    const esCredito = !!client.clienteCredito;
                    const creditoLabel = esCredito
                        ? '<span class="status-pill status-credit">Crédito</span>'
                        : '<span class="status-pill status-cash">Contado</span>';
                    const row = `<tr>
                                    <td><a href="invoices.html?clientId=${doc.id}">${escapeHtml(doc.id || 'N/A')}</a></td>
                                    <td>${escapeHtml(client.nombreCliente || 'N/A')}</td>
                                    <td>${escapeHtml(client.nombreTienda || 'N/A')}</td>
                                    <td>${escapeHtml(client.direccion || 'N/A')}</td>
                                    <td>${escapeHtml(client.telefono || 'N/A')}</td>
                                    <td>${creditoLabel}</td>
                                    <td>${esCredito ? `${Number(client.diasCredito || 0)} días` : 'N/A'}</td>
                                    <td>
                                        <button onclick="editClient('${doc.id}')">Editar</button>
                                        <button class="danger" onclick="deleteClient('${doc.id}')">Eliminar</button>
                                    </td>
                                 </tr>`;
                    clientTable.innerHTML += row;
                });
            }).catch((error) => {
                console.error("Error al cargar los clientes: ", error);
            });
        }

        // Function to edit client
        function editClient(idCliente) {
            db.collection("clientes").doc(idCliente).get().then((doc) => {
                if (doc.exists) {
                    const client = doc.data();
                    document.getElementById('nombreCliente').value = client.nombreCliente;
                    document.getElementById('nombreTienda').value = client.nombreTienda;
                    document.getElementById('direccion').value = client.direccion;
                    document.getElementById('telefono').value = client.telefono;
                    document.getElementById('clienteCredito').checked = !!client.clienteCredito;
                    document.getElementById('diasCredito').value = String(client.diasCredito || 10);
                    toggleCreditDays();
                    idClienteActual = idCliente;  // Guardar el ID del cliente que se está editando
                } else {
                    alert("El cliente no existe");
                }
            }).catch((error) => {
                console.error("Error editando cliente: ", error);
            });
        }

        // Function to delete client
        function deleteClient(idCliente) {
            if (!confirm("¿Desea eliminar este cliente?")) return;
            db.collection("clientes").doc(idCliente).delete().then(() => {
                alert("Cliente eliminado con éxito");
                loadClients();
            }).catch((error) => {
                console.error("Error al eliminar el cliente: ", error);
            });
        }

        // Load clients when the page loads
        window.onload = function() {
            
            // Check if the user is already authenticated
            /*const isAuthenticated = sessionStorage.getItem('isAuthenticated');
            if (!isAuthenticated) {
                alert("Debe autenticarse primero");
                window.location.href = "index.html"; // Redirigir a la página de inicio de sesión si no está autenticado
            }else{
                loadClients();
            }*/
            
            toggleCreditDays();
            loadClients();
            
        };
    </script>
</body>
</html>
