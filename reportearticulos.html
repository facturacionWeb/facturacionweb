<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reporte de Artículos 📊</title>
  
  <!-- Importa Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <!-- Tu configuración de Firebase -->
  <script src="https://facturacionweb.github.io/facturacionweb/firebase-config.js"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-bottom: 20px;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }
    th span {
      font-size: 12px;
    }
    /* Estilos para el modal */
    .modal {
      display: none; /* Se oculta por defecto */
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.55); /* Fondo semi-transparente */
    }
    .modal-content {
      background-color: #fff;
      margin: 5% auto;
      padding: 0;
      border: 0;
      border-radius: 10px;
      width: 92%;
      max-width: 920px;
      position: relative;
      box-shadow: 0 18px 60px rgba(0,0,0,0.28);
      overflow: hidden;
    }
    .close {
      color: #666;
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
    }
    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
    }
    .modal-header {
      padding: 24px 28px 18px;
      border-bottom: 1px solid #e5e7eb;
      background: #f8fafc;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 24px;
    }
    .modal-subtitle {
      margin-top: 6px;
      color: #666;
      font-size: 14px;
    }
    .modal-body {
      padding: 18px 28px 26px;
      max-height: 65vh;
      overflow-y: auto;
    }
    .imei-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .imei-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px;
      background: #fff;
    }
    .imei-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 10px;
    }
    .imei-value {
      font-size: 18px;
      font-weight: 700;
      color: #111;
      word-break: break-word;
    }
    .invoice-badge {
      background: #eef2ff;
      color: #3730a3;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .imei-details {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .detail-item {
      background: #f9fafb;
      border-radius: 6px;
      padding: 10px;
      min-width: 0;
    }
    .detail-label {
      display: block;
      color: #666;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .detail-value {
      color: #111;
      font-weight: 600;
      word-break: break-word;
    }
    .empty-state {
      padding: 22px;
      text-align: center;
      color: #666;
      background: #f9fafb;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
    }
    @media (max-width: 720px) {
      .modal-content {
        margin: 4% auto;
        width: 96%;
      }
      .imei-card-header {
        align-items: flex-start;
        flex-direction: column;
      }
      .imei-details {
        grid-template-columns: 1fr;
      }
    }
  </style>
  
  <script>
    // Variables globales para almacenar datos y el estado de ordenamiento
    let articlesData = [];
    let currentSortColumn = null;
    let currentSortDirection = 'asc';

    // Inicializar Firestore
    const db = firebase.firestore();

    // Función para cargar el reporte y almacenar la data en un arreglo
    function loadReport() {
      document.getElementById('reportTable').innerHTML = '';
      const imeiCounts = {};

      // Primero, obtenemos los IMEI para contarlos
      db.collection("Articulos_X_IMEI").get()
        .then((querySnapshot) => {
          querySnapshot.forEach((doc) => {
            const data = doc.data();
            if (data.articleId) {
              if (!imeiCounts[data.articleId]) {
                imeiCounts[data.articleId] = 0;
              }
              imeiCounts[data.articleId]++;
            }
          });
          // Luego, obtenemos los artículos
          return db.collection("Articulos").get();
        })
        .then((querySnapshot) => {
          articlesData = []; // reiniciamos el arreglo
          querySnapshot.forEach((doc) => {
            const article = doc.data();
            // Convertir precios a número (por si vienen como string)
            let precioCompra = parseFloat(article.precioCompra) || 0;
            let precioVenta = parseFloat(article.precioVenta) || 0;
            const count = imeiCounts[article.id] || 0;
            const total = precioCompra * count;
            articlesData.push({
              id: article.id,
              marca: article.marca,
              modelo: article.modelo,
              precioCompra: precioCompra,
              precioVenta: precioVenta,
              count: count,
              total: total
            });
          });
          // Reiniciamos el ordenamiento por defecto
          currentSortColumn = null;
          currentSortDirection = 'asc';
          updateSortIndicators();
          renderTable();
        })
        .catch((error) => {
          console.error("Error al cargar el reporte: ", error);
        });
    }

    // Función que renderiza la tabla, aplicando ordenamiento si corresponde
    function renderTable() {
      let tableContent = '';
      let grandTotal = 0;
      // Si se ha seleccionado una columna para ordenar, ordenamos el arreglo
      if (currentSortColumn) {
        articlesData.sort((a, b) => {
          let valueA = a[currentSortColumn], valueB = b[currentSortColumn];
          if (typeof valueA === 'string') {
            return currentSortDirection === 'asc'
              ? valueA.localeCompare(valueB)
              : valueB.localeCompare(valueA);
          } else {
            return currentSortDirection === 'asc'
              ? valueA - valueB
              : valueB - valueA;
          }
        });
      }
      // Construir las filas de la tabla
      articlesData.forEach((article) => {
        grandTotal += article.total;
        tableContent += `<tr>
          <td>${article.id}</td>
          <td>${article.marca}</td>
          <td>${article.modelo}</td>
          <td>${article.precioCompra}</td>
          <td>${article.precioVenta}</td>
          <td style="cursor:pointer; color: blue;" onclick="showIMEIModal('${article.id}')">${article.count}</td>
          <td>${article.total.toFixed(2)}</td>
        </tr>`;
      });
      // Fila de Total General
      tableContent += `<tr>
        <td colspan="6" style="text-align: right; font-weight: bold;">Total General:</td>
        <td style="font-weight: bold;">${grandTotal.toFixed(2)}</td>
      </tr>`;
      document.getElementById('reportTable').innerHTML = tableContent;
    }

    // Función para ordenar por la columna indicada
    function sortTable(column) {
      if (currentSortColumn === column) {
        // Si ya está ordenada por esa columna, invertimos la dirección
        currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        currentSortColumn = column;
        currentSortDirection = 'asc';
      }
      updateSortIndicators();
      renderTable();
    }

    // Actualiza los indicadores de orden (flechas) en los encabezados
    function updateSortIndicators() {
      const columns = ['marca', 'modelo', 'precioCompra', 'precioVenta', 'count'];
      columns.forEach((col) => {
        const span = document.getElementById('sort' + col.charAt(0).toUpperCase() + col.slice(1));
        if (currentSortColumn === col) {
          span.innerText = currentSortDirection === 'asc' ? ' ▲' : ' ▼';
        } else {
          span.innerText = '';
        }
      });
    }

    // Función para mostrar el modal con el listado de IMEI de un artículo
    /*function showIMEIModal(articleId) {
      document.getElementById('modalArticleId').innerText = articleId;
      document.getElementById('imeiList').innerHTML = '';

    function showIMEIModal(articleId) {
      document.getElementById('modalArticleId').innerText = articleId;
      document.getElementById('imeiList').innerHTML = '';
    
      db.collection("Articulos_X_IMEI").where("articleId", "==", articleId).get()
        .then(async (querySnapshot) => {
          if (querySnapshot.empty) {
            document.getElementById('imeiList').innerHTML = '<li>No hay IMEI registrados 😬</li>';
          } else {
            for (const doc of querySnapshot.docs) {
              const data = doc.data();
              const imei = data.imei;
              const proveedorId = data.proveedorId;
    
              let proveedorNombre = "N/D";
              if (proveedorId) {
                try {
                  const provDoc = await db.collection("proveedores").doc(proveedorId).get();
                  if (provDoc.exists) {
                    proveedorNombre = provDoc.data().nombreProveedor || "Desconocido";
                  }
                } catch (err) {
                  console.warn("Error obteniendo proveedor:", err);
                }
              }
    
              const li = document.createElement('li');
              li.textContent = `IMEI: ${imei} - Proveedor: ${proveedorNombre}`;
              document.getElementById('imeiList').appendChild(li);
            }
          }
    
          document.getElementById('imeiModal').style.display = 'block';
        })
        .catch((error) => {
          console.error("Error al cargar los IMEI: ", error);
        });
    }


    function escapeHtml(value) {
      return String(value ?? 'N/D')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showIMEIModal(articleId) {
      const list = document.getElementById('imeiList');
      document.getElementById('modalArticleId').innerText = articleId;
      document.getElementById('modalImeiCount').innerText = 'Cargando IMEIs...';
      list.innerHTML = '<div class="empty-state">Cargando informacion de inventario...</div>';
      document.getElementById('imeiModal').style.display = 'block';

      db.collection("Articulos_X_IMEI").where("articleId", "==", articleId).get()
        .then(async (querySnapshot) => {
          list.innerHTML = '';

          if (querySnapshot.empty) {
            document.getElementById('modalImeiCount').innerText = '0 IMEIs registrados';
            list.innerHTML = '<div class="empty-state">No hay IMEI registrados para este articulo.</div>';
            return;
          }

          document.getElementById('modalImeiCount').innerText = `${querySnapshot.size} IMEIs registrados`;

          for (const doc of querySnapshot.docs) {
            const data = doc.data();
            const proveedorId = data.distribuidorId || data.proveedorId;
            let proveedorNombre = data.distribuidorNombre || "N/D";

            if ((!proveedorNombre || proveedorNombre === "N/D") && proveedorId) {
              try {
                const provDoc = await db.collection("proveedores").doc(proveedorId).get();
                if (provDoc.exists) {
                  proveedorNombre = provDoc.data().nombreProveedor || "Desconocido";
                }
              } catch (err) {
                console.warn("Error obteniendo proveedor:", err);
              }
            }

            const tipoFactura = data.tipoFacturaProveedor || 'N/D';
            const fechaVencimiento = data.fechaVencimientoProveedor || (tipoFactura === 'Credito' ? 'Sin fecha' : 'No aplica');
            const facturaProveedor = data.facturaDistribuidor || 'N/D';

            const card = document.createElement('div');
            card.className = 'imei-card';
            card.innerHTML = `
              <div class="imei-card-header">
                <div>
                  <span class="detail-label">IMEI</span>
                  <div class="imei-value">${escapeHtml(data.imei)}</div>
                </div>
                <span class="invoice-badge">Factura: ${escapeHtml(facturaProveedor)}</span>
              </div>
              <div class="imei-details">
                <div class="detail-item">
                  <span class="detail-label">Distribuidor</span>
                  <span class="detail-value">${escapeHtml(proveedorNombre)}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">Factura proveedor</span>
                  <span class="detail-value">${escapeHtml(facturaProveedor)}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">Tipo factura</span>
                  <span class="detail-value">${escapeHtml(tipoFactura)}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">Vencimiento</span>
                  <span class="detail-value">${escapeHtml(fechaVencimiento)}</span>
                </div>
              </div>
            `;
            list.appendChild(card);
          }
        })
        .catch((error) => {
          console.error("Error al cargar los IMEI: ", error);
          document.getElementById('modalImeiCount').innerText = 'Error al cargar IMEIs';
          list.innerHTML = '<div class="empty-state">Ocurrio un error al cargar la informacion.</div>';
        });
    }

    // Función para cerrar el modal
    function closeModal() {
      document.getElementById('imeiModal').style.display = 'none';
    }

    // Cerrar el modal si el usuario hace clic fuera de la caja del modal
    window.addEventListener('click', function(event) {
      if (event.target == document.getElementById('imeiModal')) {
        closeModal();
      }
    });
  </script>
  <script type="module">
    import {requireAccess} from './auth.js';
    requireAccess('reportearticulos');  
  </script>
</head>
<body>
  <h1>:: Reporte de Artículos ::</h1>
  <button onclick="loadReport()">Cargar Reporte</button>
  
  <table>
    <thead>
      <tr>
        <th>ID del Artículo</th>
        <th onclick="sortTable('marca')" style="cursor: pointer;">Marca<span id="sortMarca"></span></th>
        <th onclick="sortTable('modelo')" style="cursor: pointer;">Modelo<span id="sortModelo"></span></th>
        <th onclick="sortTable('precioCompra')" style="cursor: pointer;">Precio Compra<span id="sortPrecioCompra"></span></th>
        <th onclick="sortTable('precioVenta')" style="cursor: pointer;">Precio Venta<span id="sortPrecioVenta"></span></th>
        <th onclick="sortTable('count')" style="cursor: pointer;">Cantidad de IMEI<span id="sortCount"></span></th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="reportTable">
      <!-- Aquí se cargarán los datos del reporte -->
    </tbody>
  </table>
  
  <!-- Modal para mostrar el listado de IMEI -->
  <div id="imeiModal" class="modal">
    <div class="modal-content">
      <span class="close" id="closeModal" onclick="closeModal()">&times;</span>
      <div class="modal-header">
        <h2>IMEI para el artículo <span id="modalArticleId"></span></h2>
        <div class="modal-subtitle" id="modalImeiCount">Seleccione un artículo para ver sus IMEIs.</div>
      </div>
      <div class="modal-body">
        <div id="imeiList" class="imei-list">
          <!-- Aquí se listan los IMEI -->
        </div>
      </div>
    </div>
  </div>
</body>
</html>
